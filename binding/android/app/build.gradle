plugins { id 'com.android.application' }
plugins { id 'org.jetbrains.kotlin.android' }

android {
    namespace 'dev.alfayez.odinsokol'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'dev.alfayez.odinsokol'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets {
        main {
            java.srcDirs += rootProject.file('../../build/generated/android')
            kotlin.srcDirs += rootProject.file('../../build/generated/android')
            jniLibs.srcDirs += rootProject.file('../../build/android/jni')
        }
    }
}

dependencies {
    implementation files(rootProject.file('../../deps/SDL3-3.2.28.aar'))
}
