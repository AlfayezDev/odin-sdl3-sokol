name: OdinSokol
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.4"
projectReferences:
  SDL:
    path: ../../deps/SDL3-3.2.28/Xcode/SDL/SDL.xcodeproj
targets:
  odin-sokol:
    type: application
    platform: iOS
    sources:
      - entry.m
      - generated/GameBridge.swift
      - BridgePlatform.swift
    settings:
      base:
        CLANG_ENABLE_OBJC_ARC: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.alfayez.odinsokol
        INFOPLIST_FILE: "$(SRCROOT)/../../binding/ios/Info.plist"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../deps/SDL3-3.2.28/include"
        SWIFT_VERSION: "5.9"
        OTHER_LDFLAGS: '$(inherited) -lc++ "$(DERIVED_FILE_DIR)/odin-app.o" "$(DERIVED_FILE_DIR)/sokol_gfx.o"'
    dependencies:
      - target: SDL/SDL3
        embed: true
        codeSign: true
      - sdk: OpenGLES.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UIKit.framework
    preBuildScripts:
      - name: Compile Odin app + sokol headers
        script: |
          set -e
          root="$PWD"
          out="$DERIVED_FILE_DIR"
          odin_bin=$(command -v odin || echo /opt/homebrew/bin/odin)
          case $PLATFORM_NAME in iphoneos) plat=iphone;; iphonesimulator) plat=iphonesimulator;; *) echo "unsupported platform" >&2; exit 1;; esac
          objs=()
          for arch in $ARCHS; do
            "$odin_bin" build "$root/app" -collection:libs="$root/vendors" -collection:gen="$root/binding/generated" \
              -o:speed -target:darwin_arm64 -subtarget:$plat -minimum-os-version:17.4 \
              -build-mode:obj -no-entry-point -out:"$out/odin-$plat-$arch.o"
            objs+=("$out/odin-$plat-$arch.o")
          done
          if [ ${#objs[@]} -gt 1 ]; then
            xcrun lipo -create "${objs[@]}" -output "$out/odin-app.o"
          else
            cp "${objs[0]}" "$out/odin-app.o"
          fi
          for arch in $ARCHS; do
            xcrun -sdk "$SDKROOT" clang -x c -c -arch "$arch" -O2 -DSOKOL_NO_ENTRY -DSOKOL_GLES3 -DSOKOL_IMPL \
              -include sokol_log.h -I"$root/vendors/sokol" "$root/vendors/sokol/sokol_gfx.h" -o "$out/sokol_gfx-$arch.o"
          done
          if [ ${#ARCHS[@]} -gt 1 ]; then
            xcrun lipo -create "$out"/sokol_gfx-*.o -output "$out/sokol_gfx.o"
          else
            cp "$out/sokol_gfx-${ARCHS[0]}.o" "$out/sokol_gfx.o"
          fi
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/odin-app.o
          - $(DERIVED_FILE_DIR)/sokol_gfx.o
schemes:
  odin-sokol:
    build:
      targets:
        odin-sokol: all
