name: OdinSokol
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.4"
projectReferences:
  SDL:
    path: deps/SDL3-3.2.28/Xcode/SDL/SDL.xcodeproj
targets:
  odin-sokol:
    type: application
    platform: iOS
    settings:
      base:
        CLANG_ENABLE_OBJC_ARC: YES
        SAMPLE_ID: 0
        SMOKE_FRAMES: 0
        PRODUCT_BUNDLE_IDENTIFIER: dev.alfayez.odinsokol
        INFOPLIST_FILE: "$(SRCROOT)/../../ios/Info.plist"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../deps/SDL3-3.2.28/include"
        OTHER_LDFLAGS: '$(inherited) -lc++ "$(DERIVED_FILE_DIR)/odin-app.o" "$(DERIVED_FILE_DIR)/sokol_gfx.o" "$(DERIVED_FILE_DIR)/sokol_gl.o" "$(DERIVED_FILE_DIR)/sokol_debugtext.o" "$(DERIVED_FILE_DIR)/sokol_shape.o"'
    dependencies:
      - target: SDL/SDL3
        embed: true
        codeSign: true
      - sdk: OpenGLES.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UIKit.framework
    preBuildScripts:
      - name: Compile shared Odin app
        script: 'bash "$SRCROOT/../../scripts/ios-object.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/odin-app.o
          - $(DERIVED_FILE_DIR)/sokol_gfx.o
          - $(DERIVED_FILE_DIR)/sokol_gl.o
          - $(DERIVED_FILE_DIR)/sokol_debugtext.o
          - $(DERIVED_FILE_DIR)/sokol_shape.o
schemes:
  odin-sokol:
    build:
      targets:
        odin-sokol: all
